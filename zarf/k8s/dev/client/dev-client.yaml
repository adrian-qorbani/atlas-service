apiVersion: apps/v1
kind: Deployment
metadata:
  name: client
  namespace: sales-system
spec:
  replicas: 1
  selector:
    matchLabels:
      app: client
  template:
    metadata:
      labels:
        app: client
    spec:
      dnsPolicy: ClusterFirstWithHostNet
      hostNetwork: true
      terminationGracePeriodSeconds: 60
      containers:
        - name: client
          image: client-image
          ports:
            - name: client
              containerPort: 3001
          env:
            - name: NEXT_PUBLIC_API_URL
              value: "http://localhost:3000"
            - name: NEXT_PUBLIC_AUTH_URL
              value: "http://localhost:6100"
            - name: NEXT_PUBLIC_AUTH_KID
              value: "7f7b8993-f2d6-42f9-a0e8-1c2ef16c54cd"
          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "500m"
              memory: "256Mi"
          readinessProbe:
            httpGet:
              path: /
              port: 3001
            initialDelaySeconds: 10
            periodSeconds: 10
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /
              port: 3001
            initialDelaySeconds: 15
            periodSeconds: 20
            failureThreshold: 3
---
apiVersion: v1
kind: Service
metadata:
  name: client-service
  namespace: sales-system
spec:
  type: ClusterIP
  selector:
    app: client
  ports:
    - name: client
      port: 3001
      targetPort: client